project:
  type: website
  output-dir: _site
  pre-render:
    - python3 scripts/build-manifest.py
  render:
    - en/
    - fr/
    - index.html
    - "!CLAUDE.md"
    - "!llm-docs/"

# Load multilingual extension
extensions:
  - multilang

website:
  title: "Raphaël Simon"
  description: "Personal website - Medicine, Public Health, Software Engineering, Data Science"
  site-url: https://raphaelsimon.fr
  favicon: images/favicon.jpg

  # Search functionality (uses Quarto defaults: s, f, /)
  search:
    location: navbar
    type: overlay

  # Top navigation
  navbar:
    logo: images/console-blinking.gif
    background: dark
    left:
      - text: Blog
        href: en/blog/index.qmd
      - text: About
        href: en/about.qmd
      - text: Contact
        href: en/contact.qmd
      # Hub maillage: links to the satellite subdomains (external, absolute).
      # Different-origin URLs are skipped by navbar-lang-switch.html, so these
      # are language-agnostic and render identically on /en/ and /fr/.
      - text: Kiosk
        href: https://kiosk.raphaelsimon.fr/
      - text: Gadgets
        href: https://gadgets.raphaelsimon.fr/
    right:
      - icon: github
        href: https://github.com/rplsmn
        aria-label: GitHub
      - icon: linkedin
        href: https://linkedin.com/in/raphael-simon-md
        aria-label: LinkedIn
      - icon: bluesky
        href: https://bsky.app/profile/raphsmn.bsky.social
        aria-label: Bluesky
      - icon: rss
        href: en/blog/index.xml
        aria-label: RSS Feed

  # Footer
  page-footer:
    left: |
      © 2026 Raphaël Simon

  # Enable back-to-top button
  back-to-top-navigation: true

# Theme with dark mode default
format:
  html:
    theme:
      dark:
        - darkly
        - custom-dark.scss
      light:
        - flatly
        - custom-light.scss
    css: styles.css
    toc: true
    code-copy: true
    code-overflow: wrap
    filters:
      - _extensions/multilang/hreflang.lua
      - _extensions/multilang/blog-excerpts.lua
      - _extensions/multilang/cusdis.lua
    include-after-body:
      - _includes/navbar-lang-switch.html

# Analytics (optional - add when ready)
# google-analytics: "G-XXXXXXXXXX"
