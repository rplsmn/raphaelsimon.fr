<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Redirecting...</title>
  <meta name="robots" content="noindex, nofollow">
  <script>
    // Check saved preference first, then browser language
    var saved = null;
    try { saved = localStorage.getItem('preferred-lang'); } catch(e) {}
    var lang = saved || (navigator.language && navigator.language.startsWith('fr') ? 'fr' : 'en');
    window.location.replace('/' + lang + '/');
  </script>
  <noscript>
    <!-- Fallback for users with JavaScript disabled -->
    <meta http-equiv="refresh" content="0;url=/en/" />
  </noscript>
</head>
<body>
  <p>Redirecting to language-specific homepage...</p>
  <p>If not redirected automatically, please choose:</p>
  <ul>
    <li><a href="/en/">English</a></li>
    <li><a href="/fr/">Français</a></li>
  </ul>
</body>
</html>
