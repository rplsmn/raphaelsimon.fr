<script>
document.addEventListener('DOMContentLoaded', function() {
  var path = window.location.pathname;
  var langMatch = path.match(/^\/(en|fr)\//);
  var currentLang = langMatch ? langMatch[1] : 'en';
  var origin = window.location.origin;

  // Persist language preference
  try { localStorage.setItem('preferred-lang', currentLang); } catch(e) {}

  // Navbar label translations
  var labels = {
    en: { 'Blog': 'Blog', 'About': 'About', 'Contact': 'Contact' },
    fr: { 'Blog': 'Blog', 'About': 'À propos', 'Contact': 'Contact' }
  };

  // Resolve an href (relative or absolute) to a same-origin pathname,
  // or return null for external URLs.
  function resolveSameOrigin(href) {
    if (!href) return null;
    try {
      var url = new URL(href, window.location.href);
      if (url.origin !== origin) return null;
      return url.pathname;
    } catch(e) { return null; }
  }

  // Rewrite navbar links to match current language and translate labels.
  var navLinks = document.querySelectorAll('.navbar a.nav-link');
  navLinks.forEach(function(link) {
    var resolved = resolveSameOrigin(link.getAttribute('href'));
    if (!resolved) return;
    var match = resolved.match(/^\/(en|fr)\/(.*)/);
    if (match && match[1] !== currentLang) {
      link.setAttribute('href', '/' + currentLang + '/' + match[2]);
    }
    // Translate navbar labels
    var text = link.textContent.trim();
    if (labels[currentLang][text]) {
      link.textContent = labels[currentLang][text];
    }
  });

  // Rewrite all site brand links (logo + title) to point to the current language homepage
  var brandLinks = document.querySelectorAll('.navbar-brand');
  brandLinks.forEach(function(brandLink) {
    var resolved = resolveSameOrigin(brandLink.getAttribute('href'));
    if (resolved) {
      if (resolved === '/index.html' || resolved === '/') {
        brandLink.setAttribute('href', '/' + currentLang + '/');
      } else {
        var match = resolved.match(/^\/(en|fr)\/(.*)/);
        if (match && match[1] !== currentLang) {
          brandLink.setAttribute('href', '/' + currentLang + '/' + match[2]);
        }
      }
    }
  });

  // Rewrite RSS feed link in navbar to match current language
  var rssLink = document.querySelector('.navbar a[aria-label="RSS Feed"]');
  if (rssLink) {
    var resolved = resolveSameOrigin(rssLink.getAttribute('href'));
    if (resolved) {
      var match = resolved.match(/^\/(en|fr)\/(.*)/);
      if (match && match[1] !== currentLang) {
        rssLink.setAttribute('href', '/' + currentLang + '/' + match[2]);
      }
    }
  }

  // Build the ENG | FRA toggle
  function getTargetUrl(targetLang) {
    if (path.match(/^\/(en|fr)\/blog\/posts\//)) {
      return '/' + targetLang + '/';
    }
    var pathWithoutLang = path.replace(/^\/(en|fr)\//, '');
    return '/' + targetLang + '/' + pathWithoutLang;
  }

  var li = document.createElement('li');
  li.className = 'nav-item lang-toggle';

  var enSpan = document.createElement(currentLang === 'en' ? 'span' : 'a');
  enSpan.textContent = 'ENG';
  enSpan.className = 'nav-link lang-link' + (currentLang === 'en' ? ' active' : '');
  if (currentLang !== 'en') {
    enSpan.href = getTargetUrl('en');
  }

  var sep = document.createElement('span');
  sep.textContent = ' | ';
  sep.className = 'nav-link lang-sep';

  var frSpan = document.createElement(currentLang === 'fr' ? 'span' : 'a');
  frSpan.textContent = 'FRA';
  frSpan.className = 'nav-link lang-link' + (currentLang === 'fr' ? ' active' : '');
  if (currentLang !== 'fr') {
    frSpan.href = getTargetUrl('fr');
  }

  li.appendChild(enSpan);
  li.appendChild(sep);
  li.appendChild(frSpan);

  // Place language toggle in navbar-tools area (far right, after theme toggle)
  var navbarTools = document.querySelector('.quarto-navbar-tools');
  if (navbarTools) {
    navbarTools.appendChild(li);
  } else {
    // Fallback: append to right nav
    var navbar = document.querySelector('.navbar .navbar-nav.ms-auto');
    if (navbar) {
      navbar.appendChild(li);
    }
  }
});
</script>
