<script>
document.addEventListener('DOMContentLoaded', function() {
  var path = window.location.pathname;
  var langMatch = path.match(/^\/(en|fr)\//);
  var currentLang = langMatch ? langMatch[1] : 'en';

  // Persist language preference
  try { localStorage.setItem('preferred-lang', currentLang); } catch(e) {}

  // Rewrite navbar links to match current language.
  // Use the URL API to resolve relative hrefs (../../en/...) to absolute
  // paths, then swap the language prefix. This works at any directory depth.
  var navLinks = document.querySelectorAll('.navbar a.nav-link');
  navLinks.forEach(function(link) {
    var href = link.getAttribute('href');
    if (!href || href.startsWith('http')) return;
    var resolved = new URL(href, window.location.href).pathname;
    var match = resolved.match(/^\/(en|fr)\/(.*)/);
    if (match && match[1] !== currentLang) {
      link.setAttribute('href', '/' + currentLang + '/' + match[2]);
    }
  });

  // Rewrite the site title link to point to the current language homepage
  var brandLink = document.querySelector('.navbar-brand');
  if (brandLink) {
    var brandHref = brandLink.getAttribute('href');
    if (brandHref && !brandHref.startsWith('http')) {
      var resolved = new URL(brandHref, window.location.href).pathname;
      if (resolved === '/index.html' || resolved === '/') {
        brandLink.setAttribute('href', '/' + currentLang + '/');
      } else {
        var match = resolved.match(/^\/(en|fr)\/(.*)/);
        if (match && match[1] !== currentLang) {
          brandLink.setAttribute('href', '/' + currentLang + '/' + match[2]);
        }
      }
    }
  }

  // Build the ENG | FRA toggle
  function getTargetUrl(targetLang) {
    if (path.match(/^\/(en|fr)\/blog\/posts\//)) {
      return '/' + targetLang + '/';
    }
    var pathWithoutLang = path.replace(/^\/(en|fr)\//, '');
    return '/' + targetLang + '/' + pathWithoutLang;
  }

  var li = document.createElement('li');
  li.className = 'nav-item lang-toggle';

  var enSpan = document.createElement(currentLang === 'en' ? 'span' : 'a');
  enSpan.textContent = 'ENG';
  enSpan.className = 'nav-link lang-link' + (currentLang === 'en' ? ' active' : '');
  if (currentLang !== 'en') {
    enSpan.href = getTargetUrl('en');
  }

  var sep = document.createElement('span');
  sep.textContent = ' | ';
  sep.className = 'nav-link lang-sep';

  var frSpan = document.createElement(currentLang === 'fr' ? 'span' : 'a');
  frSpan.textContent = 'FRA';
  frSpan.className = 'nav-link lang-link' + (currentLang === 'fr' ? ' active' : '');
  if (currentLang !== 'fr') {
    frSpan.href = getTargetUrl('fr');
  }

  li.appendChild(enSpan);
  li.appendChild(sep);
  li.appendChild(frSpan);

  var navbar = document.querySelector('.navbar .navbar-nav.ms-auto');
  if (navbar) {
    navbar.appendChild(li);
  }
});
</script>
