<script>
document.addEventListener('DOMContentLoaded', function() {
  var path = window.location.pathname;
  var langMatch = path.match(/^\/(en|fr)\//);
  var currentLang = langMatch ? langMatch[1] : 'en';

  function getTargetUrl(targetLang) {
    if (path.match(/^\/(en|fr)\/blog\/posts\//)) {
      return '/' + targetLang + '/';
    }
    var pathWithoutLang = path.replace(/^\/(en|fr)\//, '');
    return '/' + targetLang + '/' + pathWithoutLang;
  }

  var li = document.createElement('li');
  li.className = 'nav-item lang-toggle';

  var enSpan = document.createElement(currentLang === 'en' ? 'span' : 'a');
  enSpan.textContent = 'ENG';
  enSpan.className = 'nav-link lang-link' + (currentLang === 'en' ? ' active' : '');
  if (currentLang !== 'en') {
    enSpan.href = getTargetUrl('en');
  }

  var sep = document.createElement('span');
  sep.textContent = ' | ';
  sep.className = 'nav-link lang-sep';

  var frSpan = document.createElement(currentLang === 'fr' ? 'span' : 'a');
  frSpan.textContent = 'FRA';
  frSpan.className = 'nav-link lang-link' + (currentLang === 'fr' ? ' active' : '');
  if (currentLang !== 'fr') {
    frSpan.href = getTargetUrl('fr');
  }

  li.appendChild(enSpan);
  li.appendChild(sep);
  li.appendChild(frSpan);

  var navbar = document.querySelector('.navbar .navbar-nav.ms-auto');
  if (navbar) {
    navbar.appendChild(li);
  }
});
</script>
